name: Level 1 - Infrastructure CI

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  infrastructure-check:
    name: Verify CI Runner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1


      - name: Display runner information
        run: |
          echo "GitHub Actions runner is operational."
          echo "Operating system:"
          uname -a
          echo "Git version:"
          git --version
          echo "Docker version:"
          docker --version
          echo "Docker Compose version:"
          docker compose version


      - name: Verify repository structure
        run: |
          echo "Current repository:"
          pwd
          echo "Repository contents:"
          ls -la
          echo "Commit:"
          git rev-parse HEAD


      - name: Confirm infrastructure CI success
        run: |
          echo "Level 1 original CI infrastructure verified."


      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci


      - name: Build backend
        working-directory: ./backend
        run: npm run build


      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci


      - name: Build frontend
        working-directory: ./frontend
        run: npm run build


      - name: Build backend Docker image
        run: docker build -t minishop-backend:ci ./backend


      - name: Build frontend Docker image
        run: docker build -t minishop-frontend:ci ./frontend


      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-placeholder
        run: docker compose config --quiet


      - name: Confirm MiniShop CI success
        run: echo "MiniShop application builds and Docker configuration validated successfully."
