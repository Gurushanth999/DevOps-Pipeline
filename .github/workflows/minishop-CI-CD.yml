name: MiniShop CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read
  packages: write


concurrency:
  group: minishop-main-deployment
  cancel-in-progress: false



jobs:
  infrastructure-check:
    name: Verify CI Runner
    runs-on: ubuntu-24.04


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4.3.1



      - name: Display runner information
        run: |
          echo "GitHub Actions runner is operational."
          echo "Operating system:"
          uname -a
          echo "Git version:"
          git --version
          echo "Docker version:"
          docker --version
          echo "Docker Compose version:"
          docker compose version



      - name: Verify repository structure
        run: |
          echo "Current repository:"
          pwd
          echo "Repository contents:"
          ls -la
          echo "Commit:"
          git rev-parse HEAD



      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci



      - name: Build backend
        working-directory: ./backend
        run: npm run build



      - name: Run backend API smoke tests
        working-directory: ./backend
        run: npm test



      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci



      - name: Build frontend
        working-directory: ./frontend
        run: npm run build



      - name: Run frontend production smoke tests
        working-directory: ./frontend
        run: npm test

      
      
      - name: Build backend Docker image
        run: docker build -t minishop-backend:1.0 ./backend



      - name: Build frontend Docker image
        run: docker build -t minishop-frontend:1.0 ./frontend



      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-placeholder
        run: docker compose config --quiet



      - name: Start isolated PostgreSQL integration database
        run: |
          docker compose -f compose.test.yaml \
            -p minishop-integration-test \
            up -d --wait database



      - name: Run PostgreSQL integration tests
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgres://minishop:testpassword@127.0.0.1:55432/minishop
        run: npm run test:integration



      - name: Stop isolated PostgreSQL integration database
        if: always()
        run: |
          docker compose -f compose.test.yaml \
            -p minishop-integration-test \
            down -v --remove-orphans

      

      - name: Start full MiniShop stack
        env:
          POSTGRES_PASSWORD: ci-local-test-password
        run: |
          docker compose -p minishop-ci up -d --build --wait



      - name: Run full-stack deployment tests
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
        run: node --test tests/deployment/fullstack.test.cjs



      - name: Stop full MiniShop stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-local-test-password
        run: |
          docker compose -p minishop-ci down -v --remove-orphans



      - name: Confirm MiniShop CI success
        run: |
          echo "MiniShop builds, automated tests and Docker configuration validated successfully."



      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Publish versioned backend and frontend images
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          OWNER=$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')

          BACKEND_IMAGE="ghcr.io/$OWNER/minishop-backend:$COMMIT_SHA"
          FRONTEND_IMAGE="ghcr.io/$OWNER/minishop-frontend:$COMMIT_SHA"

          docker tag minishop-backend:1.0 "$BACKEND_IMAGE"
          docker tag minishop-frontend:1.0 "$FRONTEND_IMAGE"

          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

          echo "Published backend: $BACKEND_IMAGE"
          echo "Published frontend: $FRONTEND_IMAGE"



  
  deploy-staging:
    name: Deploy and verify staging
    needs: infrastructure-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging


    steps:

      - name: Configure trusted SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}

        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts



      - name: Deploy and verify staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail
          OWNER=$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$OWNER" "$COMMIT_SHA" <<'REMOTE'
          set -euo pipefail

          OWNER="$1"
          COMMIT_SHA="$2"

          cd ~/DevOps-Pipeline
          git fetch origin main
          git checkout --detach "$COMMIT_SHA"

          bash deployment/deploy.sh "$OWNER" "$COMMIT_SHA"
          REMOTE





  deploy-production:
    name: Promote and verify production
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production


    steps:

      - name: Configure trusted SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}

        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts



      - name: Promote published images to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail
          OWNER=$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$OWNER" "$COMMIT_SHA" <<'REMOTE'
          set -euo pipefail

          OWNER="$1"
          COMMIT_SHA="$2"

          cd ~/DevOps-Pipeline
          git fetch origin main
          git checkout --detach "$COMMIT_SHA"

          bash deployment/deploy.sh "$OWNER" "$COMMIT_SHA"
          REMOTE
