services:
  database:
    image: postgres:17
    container_name: minishop-postgres
    restart: unless-stopped


    environment:
      POSTGRES_USER: minishop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: minishop


    ports:
      - "127.0.0.1:5432:5432"


    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop -d minishop"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    image: minishop-backend:1.0
    container_name: minishop-backend
    restart: unless-stopped


    environment:
      PORT: 3000
      DATABASE_URL: postgres://minishop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/minishop


    ports:
      - "127.0.0.1:3000:3000"


    depends_on:
      database:
        condition: service_healthy
  

  frontend:
    image: minishop-frontend:1.0
    container_name: minishop-frontend
    restart: unless-stopped


    ports:
      - "127.0.0.1:8080:80"


    depends_on:
      - backend


volumes:
  postgres_data:
